name: Release to npm

# Publishes via npm OIDC trusted publishing — no long-lived token.
# The trusted publisher on npmjs.com is bound to THIS workflow filename
# (release-npm.yml); renaming the file breaks the binding. Provenance is
# generated automatically under trusted publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token exchange with registry.npmjs.org
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      # Trusted publishing needs npm >= 11.5.1; node 22 bundles npm 10.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          CI: "true"
      - run: npm run build
      - name: Smoke MCP handshake
        run: npm run smoke:mcp
      - name: Verify package version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
        if: github.event_name == 'push'
      - run: npm publish --access public
